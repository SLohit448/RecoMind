<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactions — RecoMind</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <header class="page-header">
                <div>
                    <h1 class="page-title">My Interactions</h1>
                    <p class="page-subtitle">History of your likes, views, clicks, ratings, and purchases.</p>
                </div>
                <div>
                    <button class="btn btn-secondary btn-sm" onclick="loadInteractions()">
                        <span>🔄 Refresh</span>
                    </button>
                </div>
            </header>

            <div class="table-container" id="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Category</th>
                            <th>Interaction Type</th>
                            <th>Rating</th>
                            <th>Date & Time</th>
                        </tr>
                    </thead>
                    <tbody id="interactions-tbody">
                        <tr>
                            <td colspan="5" style="text-align: center; padding: 2rem;">
                                <div class="skeleton" style="height: 24px; width: 60%; margin: 0 auto;"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        async function init() {
            const user = await App.checkAuth();
            if (!user) return;
            App.renderSidebar('interactions');
            loadInteractions();
        }

        async function loadInteractions() {
            const tbody = document.getElementById('interactions-tbody');
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" style="text-align: center; padding: 2rem;">
                        <div class="skeleton" style="height: 24px; width: 60%; margin: 0 auto;"></div>
                    </td>
                </tr>
            `;

            try {
                const res = await App.fetchJson('/api/interactions');
                const list = res.data || [];

                if (list.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="5" style="text-align: center; padding: 3rem; color: var(--text-muted);">
                                <div style="font-size: 2rem; margin-bottom: 0.5rem;">📜</div>
                                <div style="font-weight: 600; font-size: 1.1rem; color: var(--text-secondary);">No interactions recorded yet</div>
                                <p style="margin-top: 0.25rem;">Start exploring the catalog in <a href="/discover.html" style="color: var(--accent);">Discover</a> to build your history.</p>
                            </td>
                        </tr>
                    `;
                    return;
                }

                tbody.innerHTML = '';
                // Sort by recent first if dates are available
                list.slice().reverse().forEach(inRow => {
                    const tr = document.createElement('tr');

                    const badgeClass = inRow.type === 'LIKE' ? 'badge-danger'
                        : inRow.type === 'PURCHASE' ? 'badge-success'
                        : inRow.type === 'CLICK' ? 'badge-accent'
                        : inRow.type === 'RATING' ? 'badge-warning'
                        : 'badge-muted';

                    const dateStr = inRow.createdAt ? new Date(inRow.createdAt).toLocaleString() : 'Recent';

                    tr.innerHTML = `
                        <td><strong>${App.escapeHtml(inRow.itemTitle || ('Item #' + inRow.itemId))}</strong></td>
                        <td><span class="badge badge-muted">${App.escapeHtml(inRow.categoryName || 'Item')}</span></td>
                        <td><span class="badge ${badgeClass}">${App.escapeHtml(inRow.type)}</span></td>
                        <td>${inRow.rating ? '★ ' + inRow.rating : '—'}</td>
                        <td style="color: var(--text-muted); font-size: 0.85rem;">${dateStr}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 2rem; color: var(--danger);">
                            Failed to load interactions: ${App.escapeHtml(err.message)}
                        </td>
                    </tr>
                `;
            }
        }

        init();
    </script>
</body>
</html>
