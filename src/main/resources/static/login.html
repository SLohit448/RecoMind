<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — RecoMind</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <a href="#" class="brand">
                <div class="brand-icon">R</div>
                <span class="brand-name">RecoMind</span>
            </a>
            <button id="theme-toggle" class="theme-toggle-btn" onclick="App.toggleTheme()">🌙</button>
        </div>
        <p class="brand-tagline">Personalized recommendations, powered by intelligence.</p>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input class="form-input" type="email" id="email" placeholder="name@domain.com" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="password-toggle-wrap">
                    <input class="form-input" type="password" id="password" placeholder="••••••••" required>
                    <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password')">Show</button>
                </div>
            </div>

            <div id="error-box" style="display: none; color: var(--danger); font-size: 0.85rem; margin-bottom: 1rem; background: var(--danger-bg); padding: 0.6rem 0.8rem; border-radius: var(--radius-sm); border: 1px solid rgba(239, 68, 68, 0.2);"></div>

            <button type="submit" id="submit-btn" class="btn btn-primary btn-block">
                <span>Sign In</span>
            </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--text-secondary);">
            Don't have an account? <a href="/register.html" style="color: var(--accent); text-decoration: none; font-weight: 600;">Create account</a>
        </div>

        <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border-color); font-size: 0.8rem; color: var(--text-muted); text-align: center;">
            Demo: <code>admin@recomind.com / Admin@123</code> &bull; <code>user@recomind.com / User@123</code>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        function togglePasswordVisibility(fieldId) {
            const input = document.getElementById(fieldId);
            const btn = input.nextElementSibling;
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'Hide';
            } else {
                input.type = 'password';
                btn.textContent = 'Show';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submit-btn');
            const errBox = document.getElementById('error-box');

            errBox.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Signing in...';

            try {
                const res = await App.fetchJson('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });

                App.showToast('Login successful', 'success');
                if (res.data && res.data.role === 'ADMIN') {
                    window.location.href = '/admin.html';
                } else {
                    window.location.href = '/dashboard.html';
                }
            } catch (err) {
                errBox.textContent = err.message || 'Login failed';
                errBox.style.display = 'block';
                App.showToast(err.message || 'Login failed', 'error');
                btn.disabled = false;
                btn.innerHTML = 'Sign In';
            }
        }
    </script>
</body>
</html>
